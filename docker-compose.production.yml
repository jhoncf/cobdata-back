services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env.production
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c 'export MINIO_ROOT_USER="$$S3_ACCESS_KEY"; export MINIO_ROOT_PASSWORD="$$S3_SECRET_KEY"; exec minio server /data'
    env_file: .env.production
    volumes:
      - minio_data:/data
    networks: [internal]

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, minio]
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

networks:
  internal:

volumes:
  redis_data:
  minio_data:
