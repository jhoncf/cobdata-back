services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env.production
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks: [internal]

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis]
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

networks:
  internal:

volumes:
  redis_data:
